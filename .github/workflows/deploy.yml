name: Publish SDK site to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '7,22,37,52 * * * *'

permissions:
  contents: read

concurrency:
  group: sdk-site-publisher
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout website main
        uses: actions/checkout@v4
        with:
          ref: main
          path: website
          persist-credentials: false

      - name: Resolve source revisions
        id: sources
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          website_sha=$(git -C website rev-parse HEAD)
          docs_sha=$(gh api repos/aster-rpc/docs/commits/main --jq .sha)
          [[ "$website_sha" =~ ^[0-9a-f]{40}$ && "$docs_sha" =~ ^[0-9a-f]{40}$ ]]
          echo "website=$website_sha" >> "$GITHUB_OUTPUT"
          echo "docs=$docs_sha" >> "$GITHUB_OUTPUT"
          publish=true
          if [[ "$EVENT_NAME" == schedule ]]; then
            if curl --fail --silent --show-error --max-time 30 "https://sdk.getaster.now/deployment.json?run=$GITHUB_RUN_ID" -o /tmp/deployment.json; then
              if jq -e --arg website "$website_sha" --arg docs "$docs_sha" '.website == $website and .docs == $docs' /tmp/deployment.json >/dev/null; then
                publish=false
              fi
            fi
          fi
          echo "publish=$publish" >> "$GITHUB_OUTPUT"

      - name: Verify deployment configuration
        if: steps.sources.outputs.publish == 'true'
        env:
          HAS_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test "$HAS_API_TOKEN" = true || { echo 'Configure the CLOUDFLARE_API_TOKEN repository secret.' >&2; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Configure the CLOUDFLARE_ACCOUNT_ID repository variable.' >&2; exit 1; }

      - name: Checkout pinned docs
        if: steps.sources.outputs.publish == 'true'
        uses: actions/checkout@v4
        with:
          repository: aster-rpc/docs
          ref: ${{ steps.sources.outputs.docs }}
          path: docs
          persist-credentials: false

      - name: Setup Node
        if: steps.sources.outputs.publish == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            website/package-lock.json
            docs/package-lock.json

      - name: Install website dependencies
        if: steps.sources.outputs.publish == 'true'
        working-directory: website
        run: npm ci

      - name: Install docs dependencies
        if: steps.sources.outputs.publish == 'true'
        working-directory: docs
        run: npm ci

      - name: Build combined site
        if: steps.sources.outputs.publish == 'true'
        working-directory: website
        run: npm run build:combined

      - name: Write source receipt
        if: steps.sources.outputs.publish == 'true'
        working-directory: website
        env:
          WEBSITE_SHA: ${{ steps.sources.outputs.website }}
          DOCS_SHA: ${{ steps.sources.outputs.docs }}
        run: jq -n --arg website "$WEBSITE_SHA" --arg docs "$DOCS_SHA" '{website:$website,docs:$docs}' > dist/deployment.json

      - name: Deploy Cloudflare static assets
        if: steps.sources.outputs.publish == 'true'
        working-directory: website
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.147.0 deploy

      - name: Verify live routes and source receipt
        if: steps.sources.outputs.publish == 'true'
        env:
          WEBSITE_SHA: ${{ steps.sources.outputs.website }}
          DOCS_SHA: ${{ steps.sources.outputs.docs }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            if curl --fail --silent --show-error --max-time 30 "https://sdk.getaster.now/deployment.json?run=$GITHUB_RUN_ID&attempt=$attempt" -o /tmp/deployment.json &&
              jq -e --arg website "$WEBSITE_SHA" --arg docs "$DOCS_SHA" '.website == $website and .docs == $docs' /tmp/deployment.json >/dev/null; then
              break
            fi
            if [[ "$attempt" == 12 ]]; then echo 'Live source receipt did not match deployed sources.' >&2; exit 1; fi
            sleep 5
          done
          for path in / /docs/ /docs/quickstart/python/ /api/python/aster/public.html /api/typescript/ /pagefind/pagefind.js /sitemap-index.xml; do
            curl --fail --silent --show-error --location --max-time 30 "https://sdk.getaster.now$path" -o /dev/null
          done
          curl --fail --silent --show-error --location --max-time 30 'https://sdk.getaster.now/go?go-get=1' -o /tmp/go.html
          grep -F 'name="go-import" content="sdk.getaster.now/go git https://github.com/aster-rpc/aster-rpc bindings/go"' /tmp/go.html
